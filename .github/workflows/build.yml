name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: |
          pip install pandas requests beautifulsoup4 openpyxl PyPDF2 pyinstaller
          $src = "$env:GITHUB_WORKSPACE\文献综合工具"
          pyinstaller --onefile --windowed --name app --distpath "$src\dist" --workpath "$src\build" "$src\main.py"
          Get-ChildItem "$src\dist"
      # 移除 upload-artifact（避免 GitHub 存储计费问题，artifact 限额 500MB/月）
      # 如需下载打包结果，请直接克隆仓库本地用 PyInstaller 构建
